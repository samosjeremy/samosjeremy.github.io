<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Higher or Lower</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --panel-left: #2d3436;
            --panel-right: #2d3436;
            --text-color: #ffffff;
            --accent-green: #00b894;
            --accent-red: #d63031;
            --accent-gold: #fdcb6e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            height: 100dvh; 
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- LAYOUT STRUCTURE --- */
        .game-wrapper {
            flex: 1;
            position: relative;
            width: 100%;
            display: flex;
            overflow: hidden;
        }

        /* VS Circle */
        .vs-badge {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            background: white;
            color: black;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1rem;
            z-index: 10;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            border: 4px solid var(--panel-left);
        }

        /* Loading Screen */
        .loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            flex-direction: column;
        }
        
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid #fff;
            border-top: 4px solid var(--accent-green);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Game Panels */
        .game-container {
            display: flex;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .game-container.loaded { opacity: 1; }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            position: relative;
            transition: background-color 0.3s;
            overflow: hidden;
        }

        .panel-left { background-color: var(--panel-left); }
        .panel-right { background-color: var(--panel-right); }

        .flag {
            width: 150px; /* Restored larger size */
            height: auto;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            margin-bottom: 15px;
            object-fit: cover;
        }

        h1 { font-size: 2.2rem; margin-bottom: 5px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); line-height: 1.1; }
        .population-display { font-size: 2.8rem; font-weight: bold; color: #ffeaa7; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .label { font-size: 1rem; opacity: 0.8; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px;}

        /* Buttons */
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
            width: 100%;
            max-width: 300px;
        }

        .btn {
            padding: 15px 0;
            width: 100%;
            font-size: 1.1rem;
            font-weight: bold;
            border: 2px solid white;
            border-radius: 50px;
            cursor: pointer;
            background: rgba(0,0,0,0.2);
            color: white;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .btn:active { background: white; color: black; transform: scale(0.98); }
        @media (hover: hover) {
            .btn:hover { background: white; color: black; transform: scale(1.05); }
        }

        /* SCORE BOARDS */
        .score-board {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 1.5rem;
            z-index: 20;
            background: rgba(0,0,0,0.6);
            padding: 5px 15px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
        }

        .high-score-board {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 1.2rem;
            z-index: 20;
            background: rgba(0,0,0,0.6);
            padding: 5px 15px;
            border-radius: 20px;
            color: var(--accent-gold);
            font-weight: bold;
            backdrop-filter: blur(5px);
        }

        /* Animations */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }

        .shake { animation: shake 0.4s ease-in-out; }
        .correct-flash { background-color: var(--accent-green) !important; }
        .wrong-flash { background-color: var(--accent-red) !important; }

        @media (max-width: 768px) {
            .game-wrapper { flex-direction: column; }
            .game-container { flex-direction: column; }
            
            /* Give bottom panel slightly more room for buttons */
            .panel-left { flex: 0.9; } 
            .panel-right { flex: 1.1; }

            .panel { padding: 10px; }
            .flag { width: 100px; margin-bottom: 10px; }
            h1 { font-size: 1.6rem; margin-bottom: 2px; }
            .population-display { font-size: 2rem; }
            
            .high-score-board { font-size: 0.9rem; top: 10px; left: 10px; padding: 4px 10px; }
            .score-board { font-size: 1.2rem; bottom: 10px; right: 10px; padding: 4px 10px; }
            
            .btn { padding: 12px 0; font-size: 1rem; }
            .btn-container { gap: 8px; margin-top: 10px; }
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        
        .modal-content {
            background: #2d3436;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid #555;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 400px;
        }
        
        .new-record-text {
            color: var(--accent-gold);
            font-weight: bold;
            font-size: 1.2rem;
            margin-top: 10px;
            display: none;
        }
        .new-record-text.show { display: block; animation: shake 0.5s; }
    </style>
</head>
<body>

    <div class="loading-overlay" id="loading">
        <div class="spinner"></div>
        <p>Fetching Global Data...</p>
    </div>

    <div class="game-wrapper">
        <div class="high-score-board">🏆 Best: <span id="best-score">0</span></div>
        <div class="score-board">Score: <span id="current-score">0</span></div>
        <div class="vs-badge">VS</div>

        <div class="game-container" id="game-container">
            <div class="panel panel-left" id="left-panel">
                <img src="" alt="Flag" class="flag" id="left-flag">
                <h1 id="left-name">Loading...</h1>
                <p class="label">Population</p>
                <div class="population-display" id="left-pop">0</div>
            </div>

            <div class="panel panel-right" id="right-panel">
                <img src="" alt="Flag" class="flag" id="right-flag">
                <h1 id="right-name">Loading...</h1>
                <p class="label">Population</p>
                <div class="population-display" id="right-pop">???</div>
                
                <div class="btn-container" id="controls">
                    <button class="btn" onclick="guess('higher')">Higher ▲</button>
                    <button class="btn" onclick="guess('lower')">Lower ▼</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="game-over-modal">
        <div class="modal-content">
            <h1 style="color: #d63031">Game Over!</h1>
            <p style="font-size: 1.5rem; margin: 20px 0;">You scored: <span id="final-score" style="font-weight:bold; color:white">0</span></p>
            <p class="new-record-text" id="new-record-msg">🌟 NEW HIGH SCORE! 🌟</p>
            <button class="btn" onclick="initGame()">Play Again</button>
        </div>
    </div>

    <script>
        // GLOBAL VARIABLES
        let countriesData = [];
        let currentLeft;
        let currentRight;
        let seenCountries = new Set(); // Tracks history of current game
        let score = 0;
        let highScore = 0;
        let isAnimating = false;

        // DOM ELEMENTS
        const loadingOverlay = document.getElementById('loading');
        const gameContainer = document.getElementById('game-container');
        const leftFlag = document.getElementById('left-flag');
        const leftName = document.getElementById('left-name');
        const leftPop = document.getElementById('left-pop');
        const leftPanel = document.getElementById('left-panel');
        const rightFlag = document.getElementById('right-flag');
        const rightName = document.getElementById('right-name');
        const rightPop = document.getElementById('right-pop');
        const rightPanel = document.getElementById('right-panel');
        const controls = document.getElementById('controls');
        
        const scoreEl = document.getElementById('current-score');
        const bestScoreEl = document.getElementById('best-score');
        const modal = document.getElementById('game-over-modal');
        const finalScoreEl = document.getElementById('final-score');
        const newRecordMsg = document.getElementById('new-record-msg');

        // --- 1. LOCAL STORAGE & DATA FETCHING ---
        async function fetchCountries() {
            highScore = parseInt(localStorage.getItem('popGameHighScore')) || 0;
            bestScoreEl.innerText = highScore;

            try {
                const res = await fetch('https://restcountries.com/v3.1/all?fields=name,cca2,population,independent');
                const data = await res.json();
                countriesData = data.filter(c => c.independent && c.population > 0).map(c => ({
                    name: c.name.common,
                    code: c.cca2.toLowerCase(),
                    pop: c.population
                }));
                
                loadingOverlay.style.display = 'none';
                gameContainer.classList.add('loaded');
                initGame();

            } catch (err) {
                alert("Failed to load country data. Please refresh.");
                console.error(err);
            }
        }

        // --- 2. SMART MATCHMAKING (UNIQUE ROUNDS) ---
        function getSmartOpponent(baseCountry) {
            const minPop = baseCountry.pop * 0.5;
            const maxPop = baseCountry.pop * 4.0;

            // FILTER: 
            // 1. Not current Left
            // 2. Not in seenCountries (never repeat in same game)
            // 3. Within difficulty range
            let candidates = countriesData.filter(c => 
                c.code !== baseCountry.code && 
                !seenCountries.has(c.code) && 
                c.pop > minPop && 
                c.pop < maxPop
            );

            // FALLBACK 1: If no smart matches, widen search (but keep unique rule)
            if (candidates.length === 0) {
                candidates = countriesData.filter(c => 
                    c.code !== baseCountry.code && 
                    !seenCountries.has(c.code)
                );
            }

            // FALLBACK 2: If we literally ran out of countries (user played ~200 rounds)
            if (candidates.length === 0) {
                seenCountries.clear();
                seenCountries.add(baseCountry.code); // Keep current left
                candidates = countriesData.filter(c => c.code !== baseCountry.code);
            }

            return candidates[Math.floor(Math.random() * candidates.length)];
        }

        function formatNumber(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        function initGame() {
            score = 0;
            scoreEl.innerText = score;
            seenCountries.clear(); // RESET HISTORY FOR NEW GAME
            modal.classList.remove('active');
            newRecordMsg.classList.remove('show');
            
            // Pick initial Left
            currentLeft = countriesData[Math.floor(Math.random() * countriesData.length)];
            seenCountries.add(currentLeft.code);

            // Pick initial Right
            currentRight = getSmartOpponent(currentLeft);
            seenCountries.add(currentRight.code);

            render();
        }

        function render() {
            leftFlag.src = `https://flagcdn.com/w320/${currentLeft.code}.png`;
            leftName.innerText = currentLeft.name;
            leftPop.innerText = formatNumber(currentLeft.pop);

            rightFlag.src = `https://flagcdn.com/w320/${currentRight.code}.png`;
            rightName.innerText = currentRight.name;
            
            rightPop.innerText = "???";
            controls.style.display = 'flex';
            
            rightPanel.classList.remove('correct-flash', 'wrong-flash');
            leftPanel.classList.remove('correct-flash', 'wrong-flash');
        }

        function guess(direction) {
            if (isAnimating) return;
            isAnimating = true;

            const isHigher = currentRight.pop > currentLeft.pop;
            const correct = (direction === 'higher' && isHigher) || (direction === 'lower' && !isHigher);

            rightPop.innerText = formatNumber(currentRight.pop);
            controls.style.display = 'none';

            if (correct) {
                handleCorrect();
            } else {
                handleWrong();
            }
        }

        function handleCorrect() {
            rightPanel.classList.add('correct-flash');
            score++;
            scoreEl.innerText = score;

            setTimeout(() => {
                // Move Right to Left
                currentLeft = currentRight;
                // Get NEW opponent (logic will exclude all previously seen)
                currentRight = getSmartOpponent(currentLeft);
                seenCountries.add(currentRight.code);
                
                render();
                isAnimating = false;
            }, 1200);
        }

        function handleWrong() {
            rightPanel.classList.add('wrong-flash');
            rightPanel.classList.add('shake');
            
            // LOCAL SAVE LOGIC
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('popGameHighScore', highScore);
                bestScoreEl.innerText = highScore;
                newRecordMsg.classList.add('show');
            }

            setTimeout(() => {
                rightPanel.classList.remove('shake');
                finalScoreEl.innerText = score;
                modal.classList.add('active');
                isAnimating = false;
            }, 1500);
        }

        fetchCountries();

    </script>
</body>
</html>
