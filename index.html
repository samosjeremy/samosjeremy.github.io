<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jer's Geography Corner</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-green: #00b894;
            --accent-blue: #0984e3;
            --accent-purple: #6c5ce7;
            --hover-bg: #2d3436;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-decoration: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: radial-gradient(circle at 50% 50%, #1f1f1f 0%, #121212 100%);
        }

        /* HERO SECTION */
        .hero {
            text-align: center;
            margin-bottom: 50px;
            animation: fadeIn 1s ease-out;
        }

            .hero h1 {
                font-size: 3.5rem;
                font-weight: 800;
                margin-bottom: 10px;
                background: linear-gradient(to right, #00b894, #0984e3);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                letter-spacing: -1px;
            }

            .hero p {
                font-size: 1.2rem;
                color: #888;
                max-width: 600px;
                margin: 0 auto;
            }

        /* GAME GRID */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 800px; /* Slightly tighter since cards are smaller now */
        }

        /* GAME CARDS */
        .card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s;
            border: 1px solid #333;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Centers content vertically */
        }

            .card:hover {
                transform: translateY(-10px);
                box-shadow: 0 20px 40px rgba(0,0,0,0.5);
                background-color: var(--hover-bg);
                border-color: #555;
            }

        .icon-container {
            font-size: 4rem;
            margin-bottom: 20px;
            background: rgba(255,255,255,0.05);
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: transform 0.3s;
        }

        .card:hover .icon-container {
            transform: scale(1.1) rotate(5deg);
        }

        .card h2 {
            font-size: 1.8rem;
            margin-bottom: 30px; /* Increased margin since text is gone */
            color: white;
            font-weight: 600;
        }

        .btn-play {
            padding: 12px 35px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1rem;
            color: white;
            transition: transform 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
            max-width: 200px;
        }

        .btn-pop {
            background: linear-gradient(45deg, #d63031, #e17055);
        }

        .btn-cap {
            background: linear-gradient(45deg, #0984e3, #6c5ce7);
        }

        .card:active .btn-play {
            transform: scale(0.95);
        }

        /* FOOTER */
        .footer {
            margin-top: 60px;
            color: #444;
            font-size: 0.9rem;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.5rem;
            }

            .grid {
                grid-template-columns: 1fr;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="hero">
        <h1>Jer's Geography Corner</h1>
        
    </div>

    <div class="grid">

        <a href="population.html" class="card">
            <div class="icon-container">👥</div>
            <h2>Population Battle</h2>
            <div class="btn-play btn-pop">Play Now</div>
        </a>

        <a href="capitals.html" class="card">
            <div class="icon-container">🏛️</div>
            <h2>Country Capitals</h2>
            <div class="btn-play btn-cap">Play Now</div>
        </a>

    </div>

    

</body>
</html>
