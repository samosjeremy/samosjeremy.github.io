<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Population Battle</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --panel-left: #2d3436;
            --panel-right: #2d3436;
            --text-color: #ffffff;
            --accent-green: #00b894;
            --accent-red: #d63031;
            --accent-gold: #fdcb6e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- HOME BUTTON --- */
        .home-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.7);
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s;
            backdrop-filter: blur(5px);
            font-weight: bold;
        }

            .home-btn:hover {
                background: rgba(255, 255, 255, 0.1);
                color: white;
                transform: scale(1.05);
            }

        /* --- LAYOUT STRUCTURE --- */
        .game-wrapper {
            flex: 1;
            position: relative;
            width: 100%;
            display: flex;
            overflow: hidden;
        }

        .vs-badge {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            background: white;
            color: black;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1rem;
            z-index: 10;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            border: 4px solid var(--panel-left);
        }

        /* Loading Screen */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            flex-direction: column;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #fff;
            border-top: 4px solid var(--accent-green);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        /* Game Panels */
        .game-container {
            display: flex;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.5s;
        }

            .game-container.loaded {
                opacity: 1;
            }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            position: relative;
            transition: background-color 0.3s;
            overflow: hidden;
        }

        .panel-left {
            background-color: var(--panel-left);
        }

        .panel-right {
            background-color: var(--panel-right);
        }

        .flag {
            width: 150px;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            margin-bottom: 15px;
            object-fit: cover;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            line-height: 1.1;
        }

        .population-display {
            font-size: 2.8rem;
            font-weight: bold;
            color: #ffeaa7;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .label {
            font-size: 1rem;
            opacity: 0.8;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Buttons */
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
            width: 100%;
            max-width: 300px;
        }

        .btn {
            padding: 15px 0;
            width: 100%;
            font-size: 1.1rem;
            font-weight: bold;
            border: 2px solid white;
            border-radius: 50px;
            cursor: pointer;
            background: rgba(0,0,0,0.2);
            color: white;
            transition: all 0.2s;
            text-transform: uppercase;
        }

            .btn:active {
                background: white;
                color: black;
                transform: scale(0.98);
            }

        @media (hover: hover) {
            .btn:hover {
                background: white;
                color: black;
                transform: scale(1.05);
            }
        }

        .score-board {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 1.5rem;
            z-index: 20;
            background: rgba(0,0,0,0.6);
            padding: 5px 15px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
        }

        .correct-flash {
            background-color: var(--accent-green) !important;
        }

        .wrong-flash {
            background-color: var(--accent-red) !important;
        }

        @keyframes shake {
            0% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-10px);
            }

            50% {
                transform: translateX(10px);
            }

            75% {
                transform: translateX(-10px);
            }

            100% {
                transform: translateX(0);
            }
        }

        .shake {
            animation: shake 0.4s ease-in-out;
        }

        /* --- LEADERBOARD & MODAL STYLES --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

            .modal-overlay.active {
                opacity: 1;
                pointer-events: all;
            }

        .modal-content {
            background: #2d3436;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid #555;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 400px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .submit-section {
            margin: 20px 0;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .name-input {
            background: #222;
            border: 1px solid #555;
            color: white;
            padding: 10px;
            border-radius: 8px;
            font-size: 1.2rem;
            width: 200px;
            text-align: center;
            text-transform: uppercase;
        }

        .btn-submit {
            background: var(--accent-green);
            border: none;
            color: white;
            padding: 0 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .leaderboard-container {
            margin-top: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 10px;
            text-align: left;
        }

        .leaderboard-title {
            color: var(--accent-gold);
            text-align: center;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .score-row {
            display: flex;
            justify-content: space-between;
            padding: 8px;
            border-bottom: 1px solid #444;
            font-size: 1rem;
        }

            .score-row:nth-child(even) {
                background: rgba(255,255,255,0.05);
            }

        .rank-num {
            color: #888;
            margin-right: 10px;
            width: 20px;
        }

        .player-name {
            font-weight: bold;
        }

        .player-score {
            color: var(--accent-gold);
        }

        @media (max-width: 768px) {
            .game-wrapper {
                flex-direction: column;
            }

            .game-container {
                flex-direction: column;
            }

            .panel-left {
                flex: 0.9;
            }

            .panel-right {
                flex: 1.1;
            }

            .panel {
                padding: 10px;
            }

            .flag {
                width: 100px;
                margin-bottom: 10px;
            }

            h1 {
                font-size: 1.6rem;
            }

            .population-display {
                font-size: 2rem;
            }

            .score-board {
                font-size: 1.2rem;
                bottom: 10px;
                right: 10px;
            }

            /* Mobile adjustment for Home Button */
            .home-btn {
                top: 10px;
                left: 10px;
                padding: 6px 12px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="loading-overlay" id="loading">
        <div class="spinner"></div>
        <p>Fetching Global Data...</p>
    </div>

    <a href="index.html" class="home-btn">← Home</a>

    <div class="game-wrapper">
        <div class="score-board">Score: <span id="current-score">0</span></div>
        <div class="vs-badge">VS</div>

        <div class="game-container" id="game-container">
            <div class="panel panel-left" id="left-panel">
                <img src="" alt="Flag" class="flag" id="left-flag">
                <h1 id="left-name">Loading...</h1>
                <p class="label">Population</p>
                <div class="population-display" id="left-pop">0</div>
            </div>

            <div class="panel panel-right" id="right-panel">
                <img src="" alt="Flag" class="flag" id="right-flag">
                <h1 id="right-name">Loading...</h1>
                <p class="label">Population</p>
                <div class="population-display" id="right-pop">???</div>

                <div class="btn-container" id="controls">
                    <button class="btn" onclick="guess('higher')">Higher ▲</button>
                    <button class="btn" onclick="guess('lower')">Lower ▼</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="game-over-modal">
        <div class="modal-content">
            <h1 style="color: #d63031">Game Over!</h1>
            <p style="font-size: 1.5rem; margin: 10px 0;">Score: <span id="final-score" style="font-weight:bold; color:white">0</span></p>

            <div class="submit-section" id="submit-section">
                <input type="text" id="nickname-input" class="name-input" placeholder="NAME" maxlength="10">
                <button class="btn-submit" onclick="submitScore()">SAVE</button>
            </div>
            <p id="saved-msg" style="color: var(--accent-green); display:none; font-weight:bold;">Score Saved!</p>

            <div class="leaderboard-container">
                <div class="leaderboard-title">Global Top 10</div>
                <div id="leaderboard-list">
                    <div style="text-align:center; color:#888;">Loading...</div>
                </div>
            </div>

            <button class="btn" style="margin-top: 20px;" onclick="initGame()">Play Again</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, limit, getDocs, where, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // --- YOUR FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyBLaW3lSKDO7gMwi5_QbsLzfWPZpx2Zoto",
            authDomain: "country-population-game.firebaseapp.com",
            projectId: "country-population-game",
            storageBucket: "country-population-game.firebasestorage.app",
            messagingSenderId: "539696981786",
            appId: "1:539696981786:web:cb76a40d7ddca5f24e2ea3",
            measurementId: "G-FF3R2PNX2W"
        };
        // -----------------------------

        // Initialize Firebase safely
        let db;
        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            console.log("Firebase initialized");
        } catch (e) {
            console.warn("Firebase failed to load. Leaderboard disabled.", e);
        }

        // Global Variables
        let countriesData = [];
        let currentLeft, currentRight;
        let seenCountries = new Set();
        let score = 0;
        let isAnimating = false;

        // Fallback Data
        const BACKUP_COUNTRIES = [
            { name: "China", code: "cn", pop: 1425000000 },
            { name: "India", code: "in", pop: 1428000000 },
            { name: "USA", code: "us", pop: 340000000 },
            { name: "Indonesia", code: "id", pop: 278000000 },
            { name: "Brazil", code: "br", pop: 216000000 },
            { name: "Russia", code: "ru", pop: 144000000 },
            { name: "Japan", code: "jp", pop: 123000000 },
            { name: "Germany", code: "de", pop: 84000000 },
            { name: "France", code: "fr", pop: 68000000 },
            { name: "UK", code: "gb", pop: 67000000 }
        ];

        // DOM Elements
        const modal = document.getElementById('game-over-modal');
        const submitSection = document.getElementById('submit-section');
        const nicknameInput = document.getElementById('nickname-input');
        const leaderboardList = document.getElementById('leaderboard-list');
        const savedMsg = document.getElementById('saved-msg');
        const loadingOverlay = document.getElementById('loading');
        const gameContainer = document.getElementById('game-container');

        // --- LEADERBOARD & USER LOGIC ---

        window.submitScore = async function () {
            if (!db) return alert("Leaderboard is offline (Check Firebase console)");

            const name = nicknameInput.value.toUpperCase().trim();
            if (!name) return alert("Enter a name!");

            // 1. Save name to LocalStorage for next time
            localStorage.setItem('popGameNickname', name);

            submitSection.style.display = 'none';
            savedMsg.innerText = "Saving...";
            savedMsg.style.display = 'block';
            savedMsg.style.color = '#fff';

            try {
                // 2. CHECK IF USER ALREADY EXISTS
                const q = query(collection(db, "leaderboard"), where("name", "==", name));
                const querySnapshot = await getDocs(q);

                if (!querySnapshot.empty) {
                    // USER EXISTS - Update Score ONLY if new score is higher
                    const docRef = querySnapshot.docs[0].ref;
                    const oldScore = querySnapshot.docs[0].data().score;

                    if (score > oldScore) {
                        await updateDoc(docRef, { score: score, date: new Date() });
                        savedMsg.innerText = "New Personal Best Saved!";
                        savedMsg.style.color = "var(--accent-green)";
                    } else {
                        savedMsg.innerText = `High Score remains ${oldScore}`;
                        savedMsg.style.color = "var(--accent-gold)";
                    }
                } else {
                    // NEW USER - Create new entry
                    await addDoc(collection(db, "leaderboard"), { name: name, score: score, date: new Date() });
                    savedMsg.innerText = "Score Saved!";
                    savedMsg.style.color = "var(--accent-green)";
                }

                fetchLeaderboard();
            } catch (e) {
                console.error("Error adding score: ", e);
                alert("Error saving score. Check console.");
                submitSection.style.display = 'flex'; // Show button again on error
            }
        };

        async function fetchLeaderboard() {
            if (!db) { leaderboardList.innerHTML = "Leaderboard Offline"; return; }
            leaderboardList.innerHTML = '<div style="text-align:center; color:#888;">Loading...</div>';
            try {
                const q = query(collection(db, "leaderboard"), orderBy("score", "desc"), limit(10));
                const querySnapshot = await getDocs(q);
                let html = "";
                let rank = 1;
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    html += `<div class="score-row"><div><span class="rank-num">#${rank}</span> <span class="player-name">${data.name}</span></div><span class="player-score">${data.score}</span></div>`;
                    rank++;
                });
                leaderboardList.innerHTML = html || "No scores yet!";
            } catch (e) {
                console.error(e);
                leaderboardList.innerHTML = "Error loading scores.";
            }
        }

        // --- GAME LOGIC ---
        window.initGame = initGame;
        window.guess = guess;

        async function fetchCountries() {
            try {
                const res = await fetch('https://restcountries.com/v3.1/all?fields=name,cca2,population,independent');
                if (!res.ok) throw new Error("API Failed");
                const data = await res.json();
                countriesData = data.filter(c => (c.independent || c.cca2 === 'XK' || c.cca2 === 'PS') && c.population > 0).map(c => ({
                    name: c.name.common, code: c.cca2.toLowerCase(), pop: c.population
                }));
            } catch (err) {
                console.warn("Using Backup Data");
                countriesData = BACKUP_COUNTRIES;
            }
            loadingOverlay.style.display = 'none';
            gameContainer.classList.add('loaded');
            initGame();
        }

        function getSmartOpponent(baseCountry) {
            const minPop = baseCountry.pop * 0.5;
            const maxPop = baseCountry.pop * 4.0;
            let candidates = countriesData.filter(c => c.code !== baseCountry.code && !seenCountries.has(c.code) && c.pop > minPop && c.pop < maxPop);
            if (candidates.length === 0) candidates = countriesData.filter(c => c.code !== baseCountry.code && !seenCountries.has(c.code));
            if (candidates.length === 0) { seenCountries.clear(); seenCountries.add(baseCountry.code); candidates = countriesData.filter(c => c.code !== baseCountry.code); }
            return candidates[Math.floor(Math.random() * candidates.length)];
        }

        function formatNumber(num) { return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ","); }

        function initGame() {
            score = 0;
            document.getElementById('current-score').innerText = score;
            seenCountries.clear();
            modal.classList.remove('active');

            // RESET UI & CHECK LOCAL STORAGE
            submitSection.style.display = 'flex';
            savedMsg.style.display = 'none';

            // Auto-fill nickname if they played before
            const savedName = localStorage.getItem('popGameNickname');
            if (savedName) {
                nicknameInput.value = savedName;
            } else {
                nicknameInput.value = "";
            }

            currentLeft = countriesData[Math.floor(Math.random() * countriesData.length)];
            seenCountries.add(currentLeft.code);
            currentRight = getSmartOpponent(currentLeft);
            seenCountries.add(currentRight.code);
            render();
        }

        function render() {
            document.getElementById('left-flag').src = `https://flagcdn.com/w320/${currentLeft.code}.png`;
            document.getElementById('left-name').innerText = currentLeft.name;
            document.getElementById('left-pop').innerText = formatNumber(currentLeft.pop);
            document.getElementById('right-flag').src = `https://flagcdn.com/w320/${currentRight.code}.png`;
            document.getElementById('right-name').innerText = currentRight.name;
            document.getElementById('right-pop').innerText = "???";
            document.getElementById('controls').style.display = 'flex';
            document.getElementById('right-panel').classList.remove('correct-flash', 'wrong-flash');
            document.getElementById('left-panel').classList.remove('correct-flash', 'wrong-flash');
        }

        function guess(direction) {
            if (isAnimating) return;
            isAnimating = true;
            const isHigher = currentRight.pop > currentLeft.pop;
            const correct = (direction === 'higher' && isHigher) || (direction === 'lower' && !isHigher);
            document.getElementById('right-pop').innerText = formatNumber(currentRight.pop);
            document.getElementById('controls').style.display = 'none';
            if (correct) handleCorrect(); else handleWrong();
        }

        function handleCorrect() {
            document.getElementById('right-panel').classList.add('correct-flash');
            score++;
            document.getElementById('current-score').innerText = score;
            setTimeout(() => {
                currentLeft = currentRight;
                currentRight = getSmartOpponent(currentLeft);
                seenCountries.add(currentRight.code);
                render();
                isAnimating = false;
            }, 1200);
        }

        function handleWrong() {
            const rp = document.getElementById('right-panel');
            rp.classList.add('wrong-flash');
            rp.classList.add('shake');
            setTimeout(() => {
                rp.classList.remove('shake');
                document.getElementById('final-score').innerText = score;
                modal.classList.add('active');
                if (db) fetchLeaderboard();
                isAnimating = false;
            }, 1500);
        }

        fetchCountries();
    </script>
</body>
</html>
